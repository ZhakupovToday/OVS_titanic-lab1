name: Inference Service Unit Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with pycodestyle
        run: pycodestyle src test
      - name: Test with pytest
        run: PYTHONPATH=./:./src pytest -v test
      - name: Train model (smoke test)
        run: PYTHONPATH=./src python src/train.py --data data/titanic.csv --out models/pipeline.pkl
